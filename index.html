  async function translateCaptionText(text, target){
    if(!text || target==='ja') return text;
    const key=target+'|'+text;
    if(captionTranslationCache.has(key)) return captionTranslationCache.get(key);
    // Translate the complete label in small chunks instead of silently truncating it.
    const chunks=text.match(/[\s\S]{1,350}/g)||[text];
    try{
      const translated=[];
      for(const chunk of chunks){
        const u=new URL('https://translate.googleapis.com/translate_a/single');
        u.searchParams.set('client','gtx');u.searchParams.set('sl','auto');u.searchParams.set('tl',target);u.searchParams.set('dt','t');u.searchParams.set('q',chunk);
        const r=await fetch(u);if(!r.ok)throw new Error('Translation unavailable');
        const data=await r.json();translated.push((data[0]||[]).map(part=>part[0]||'').join('')||chunk);
      }
      const result=translated.join('');captionTranslationCache.set(key,result);return result;
    }catch(e){console.warn('Caption translation unavailable',e);return text;}
  }
  function splitSpeciesLabel(value){
    const text=String(value||'');
    // Keep Latin scientific names intact while translating the common-name portion.
    const m=text.match(/^(\s*)(.*?)([（(][^（）()]*[A-Za-z][^（）()]*[）)])(\s*)$/);
    if(m)return {prefix:m[1],common:m[2],scientific:m[3],suffix:m[4]};
    return {prefix:'',common:text,scientific:'',suffix:''};
  }
  function translateVisibleCaptions(figures){
    const lang=languageSelect.value;const tasks=[];
    for(const fig of figures){
      const cap=fig.querySelector('figcaption');if(!cap)continue;
      const title=cap.querySelector('b');if(!title)continue;
      // Original cards have a bold number followed by a text node; added cards put both in <b>.
      let node=[...cap.childNodes].find(n=>n.nodeType===3&&n.nodeValue.trim()&&n.nodeName!=='BR');
      let isDynamic=false;
      if(!node){node=title;isDynamic=true;}
      if(!captionOriginals.has(node))captionOriginals.set(node,node.nodeValue);
      const original=captionOriginals.get(node);
      if(lang==='ja'){node.nodeValue=original;captionLanguages.set(node,'ja');continue;}
      if(captionLanguages.get(node)===lang||captionPending.has(node))continue;
      captionPending.add(node);
      tasks.push(async()=>{
        let prefix='',label=original;
        if(isDynamic){const m=original.match(/^(\s*\d+\s*[　 ]*)(.*)$/);if(m){prefix=m[1];label=m[2];}}
        const parts=splitSpeciesLabel(label);
        const translatedCommon=await translateCaptionText(parts.common,lang);
        const translated=prefix+parts.prefix+translatedCommon+parts.scientific+parts.suffix;
        if(languageSelect.value===lang){node.nodeValue=translated;captionLanguages.set(node,lang);}
        captionPending.delete(node);
      });
    }
    (async()=>{for(let i=0;i<tasks.length;i+=4){await Promise.all(tasks.slice(i,i+4).map(run=>run()));}})();
  }

    const pages=Math.max(1,Math.ceil(filteredFigures.length/PAGE_SIZE)); currentPage=Math.min(currentPage,pages);
    const start=(currentPage-1)*PAGE_SIZE; const visible=new Set(filteredFigures.slice(start,start+PAGE_SIZE));

  async function loadINaturalist(){if(loading||count>=TARGET)return;loading=true;loadINatBtn.disabled=true;updateStatus('loading','inat');try{let added=0;for(let page=1;page<=10&&count<TARGET;page++){const u=new URL('https://api.inaturalist.org/v1/observations');u.searchParams.set('taxon_name','Blattodea');u.searchParams.set('photos','true');u.searchParams.set('photo_license','any');u.searchParams.set('per_page','100');u.searchParams.set('page',String(page));u.searchParams.set('order_by','votes');const r=await fetch(u);if(!r.ok)throw new Error('iNaturalist API error');const data=await r.json();const observations=data.results||[];if(!observations.length)break;for(const ob of observations){for(const ph of ob.photos||[]){if(count>=TARGET)break;const lic=ph.license_code||'';if(!lic)continue;const photoUrl=(ph.url||'').replace('/square.','/medium.').replace('/small.','/medium.');const href=ob.uri||`https://www.inaturalist.org/observations/${ob.id}`;const attribution=ph.attribution||ob.user?.name||ob.user?.login||'';const desc=[ob.taxon?.name||ob.species_guess||'Blattodea',ob.description||''].filter(Boolean).join(' — ');const licenseMap={'cc0':'https://creativecommons.org/publicdomain/zero/1.0/','cc-by':'https://creativecommons.org/licenses/by/4.0/','cc-by-sa':'https://creativecommons.org/licenses/by-sa/4.0/','cc-by-nc':'https://creativecommons.org/licenses/by-nc/4.0/','cc-by-nc-sa':'https://creativecommons.org/licenses/by-nc-sa/4.0/','cc-by-nd':'https://creativecommons.org/licenses/by-nd/4.0/','cc-by-nc-nd':'https://creativecommons.org/licenses/by-nc-nd/4.0/'};const licenseUrl=licenseMap[lic]||'';if(addCard({href:href+'#photo-'+ph.id,img:photoUrl,title:ob.taxon?.name||ob.species_guess||'Blattodea',description:desc,source:'inat',sourceLabel:'iNaturalist',author:attribution,license:lic,licenseUrl,scientific:ob.taxon?.preferred_common_name||ob.taxon?.name||ob.species_guess||'Blattodea',imageId:String(ph.id)})){added++;} }if(count%10===0)refreshGallery();if(count>=TARGET)break;}}refreshGallery();updateStatus('done','inat');}catch(e){console.error(e);updateStatus('error');}finally{loading=false;loadINatBtn.disabled=false;}}
  async function loadGBIF(){if(loading||count>=TARGET)return;loading=true;loadGBIFBtn.disabled=true;updateStatus('loading','gbif');try{const match=await fetch('https://api.gbif.org/v1/species/match?name=Blattodea&strict=true').then(r=>{if(!r.ok)throw new Error('GBIF taxonomy error');return r.json();});const taxonKey=match.usageKey||match.speciesKey;if(!taxonKey)throw new Error('GBIF taxon not found');let added=0;for(let offset=0;offset<10000&&count<TARGET;offset+=100){const u=new URL('https://api.gbif.org/v1/occurrence/search');u.searchParams.set('taxonKey',String(taxonKey));u.searchParams.set('mediaType','StillImage');u.searchParams.set('limit','100');u.searchParams.set('offset',String(offset));u.searchParams.set('basisOfRecord','HUMAN_OBSERVATION');const data=await fetch(u).then(r=>{if(!r.ok)throw new Error('GBIF occurrence error');return r.json();});const results=data.results||[];if(!results.length)break;for(const ob of results){for(const media of ob.media||[]){if(count>=TARGET)break;const license=media.license||ob.license||'';if(!/creativecommons\.org\/(licenses|publicdomain\/zero)|CC0|CC[_ -]BY/i.test(license))continue;const img=media.identifier;if(!img||!/^https?:\/\//i.test(img))continue;const href=`https://www.gbif.org/occurrence/${ob.key}`;if(addCard({href,img,title:ob.scientificName||'Blattodea',description:media.description||ob.occurrenceRemarks||'',source:'gbif',sourceLabel:'GBIF',author:media.creator||media.rightsHolder||ob.recordedBy||'',license,licenseUrl:/^https?:\/\//i.test(license)?license:'',scientific:ob.scientificName||'Blattodea',imageId:String(ob.key)}))added++;} }if(count%10===0)refreshGallery();if(count>=TARGET||offset+100>=data.count)break;}refreshGallery();updateStatus('done','gbif');}catch(e){console.error(e);updateStatus('error');}finally{loading=false;loadGBIFBtn.disabled=false;}}
  downloadBtn.addEventListener('click',()=>{const html='<!doctype html>\n'+document.documentElement.outerHTML;const blob=new Blob([html],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cockroach_photo_gallery_multilingual.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
  loadBtn.addEventListener('click',loadCommons);loadINatBtn.addEventListener('click',loadINaturalist);loadGBIFBtn.addEventListener('click',loadGBIF);
  updateStatus();applyLanguage();setTimeout(loadCommons,300);
})();
</script>
<script>
(() => {
  const cache = new Map();
  const language = () => document.getElementById('languageSelect')?.value || 'ja';
  const dictTip = {ja:{title:'元サイトの説明',loading:'説明を取得中…',missing:'個別の説明文はありません。',fallback:'ファイル名：',author:'投稿者：',license:'ライセンス：',source:'出典：'},en:{title:'Source description',loading:'Loading description…',missing:'No individual description is available.',fallback:'Filename: ',author:'Contributor: ',license:'License: ',source:'Source: '},zh:{title:'来源说明',loading:'正在加载说明…',missing:'没有单独的说明。',fallback:'文件名：',author:'贡献者：',license:'许可证：',source:'来源：'},ko:{title:'출처 설명',loading:'설명 불러오는 중…',missing:'개별 설명이 없습니다.',fallback:'파일명: ',author:'기여자: ',license:'라이선스: ',source:'출처: '},es:{title:'Descripción de la fuente',loading:'Cargando descripción…',missing:'No hay una descripción individual.',fallback:'Archivo: ',author:'Autor: ',license:'Licencia: ',source:'Fuente: '},fr:{title:'Description de la source',loading:'Chargement de la description…',missing:'Aucune description individuelle.',fallback:'Fichier : ',author:'Auteur : ',license:'Licence : ',source:'Source : '},de:{title:'Quellenbeschreibung',loading:'Beschreibung wird geladen…',missing:'Keine individuelle Beschreibung verfügbar.',fallback:'Dateiname: ',author:'Beitragende: ',license:'Lizenz: ',source:'Quelle: '}};
  const extraLabels={ja:{full:'説明文を全文表示',dialogTitle:'説明文の全文',close:'閉じる ✕'},en:{full:'Read full description',dialogTitle:'Full description',close:'Close ✕'},zh:{full:'查看完整说明',dialogTitle:'完整说明',close:'关闭 ✕'},ko:{full:'설명 전체 보기',dialogTitle:'전체 설명',close:'닫기 ✕'},es:{full:'Leer descripción completa',dialogTitle:'Descripción completa',close:'Cerrar ✕'},fr:{full:'Lire la description complète',dialogTitle:'Description complète',close:'Fermer ✕'},de:{full:'Vollständige Beschreibung',dialogTitle:'Vollständige Beschreibung',close:'Schließen ✕'}};
  const tr = key => (extraLabels[language()]||extraLabels.ja)[key] || (dictTip[language()]||dictTip.ja)[key] || key;
  const clean = html => {const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').replace(/\s+/g,' ').trim();};
  const decodeFile = value => {try{return decodeURIComponent(String(value||'').replace(/\+/g,' ')).replace(/_/g,' ');}catch{return String(value||'').replace(/_/g,' ');}};
  const shortText = t => String(t||'').replace(/\s+/g,' ').trim();
  async function translateText(text, target){
    if(!text)return text;const key=target+'|'+text;if(cache.has(key))return cache.get(key);
    // Translate every part of longer source descriptions; the old version cut off text after 900 characters.
    const chunks=String(text).match(/[\s\S]{1,350}/g)||[String(text)];const out=[];
    try{for(const chunk of chunks){const url=new URL('https://translate.googleapis.com/translate_a/single');url.searchParams.set('client','gtx');url.searchParams.set('sl','auto');url.searchParams.set('tl',target);url.searchParams.set('dt','t');url.searchParams.set('q',chunk);const r=await fetch(url.toString());if(!r.ok)throw new Error('Translation service unavailable');const data=await r.json();out.push((data[0]||[]).map(part=>part[0]||'').join('')||chunk);}const result=out.join('');cache.set(key,result);return result;}catch(e){console.warn('Translation unavailable',e);return text;}
  }
  function renderTip(tip, text){tip.textContent='';const b=document.createElement('b');b.textContent=tr('title');const copy=document.createElement('span');copy.className='tooltip-copy';copy.textContent=text;const more=document.createElement('button');more.type='button';more.className='show-full-description';more.textContent=tr('full');more.setAttribute('aria-label',tr('full'));tip.append(b,document.createElement('br'),copy,more); }
  async function loadTooltip(link){const tip=link.querySelector('.source-tooltip');if(!tip||link.dataset.loading==='1')return;const lang=language();const source=link.dataset.source||'commons';const rawFile=link.dataset.commonsFile||link.getAttribute('href')?.split('/wiki/File:')[1]||'';let text='';
    if(source!=='commons'&&(link.dataset.description||link.dataset.tooltipBaseText)){
      if(link.dataset.tooltipBaseText){text=link.dataset.tooltipBaseText;}
      else {text=clean(link.dataset.description);const author=link.dataset.author||'';const license=link.dataset.license||'';const label=link.dataset.sourceLabel||source;const details=[label,author?tr('author')+author:'',license?tr('license')+license:''].filter(Boolean).join(' · ');text=[text,details].filter(Boolean).join(' — ');link.dataset.tooltipBaseText=text;}
      if(!text)text=tr('missing');const translated=await translateText(text,lang);renderTip(tip,translated);link.dataset.loaded='1';if(language()!==lang)loadTooltip(link);return;
    }
    const file=decodeFile(rawFile);if(!file){renderTip(tip,tr('missing'));link.dataset.loaded='1';return;}const cacheKey=lang+'|commons|'+file;if(cache.has(cacheKey)){renderTip(tip,cache.get(cacheKey));link.dataset.loaded='1';return;}
    link.dataset.loading='1';renderTip(tip,tr('loading'));
    try{const url=new URL('https://commons.wikimedia.org/w/api.php');const params={action:'query',prop:'imageinfo',iiprop:'extmetadata|commonmetadata',titles:'File:'+file,format:'json',origin:'*'};for(const[k,v]of Object.entries(params))url.searchParams.set(k,v);const res=await fetch(url.toString());if(!res.ok)throw new Error('Commons API request failed');const data=await res.json();const page=Object.values(data?.query?.pages||{})[0];const info=page?.imageinfo?.[0];const meta=info?.extmetadata||{};const common=info?.commonmetadata||[];const commonValue=name=>common.find(x=>x.name===name)?.value||'';const candidates=[clean(meta.ImageDescription?.value),clean(meta.ObjectName?.value),clean(commonValue('ImageDescription')),clean(meta.Caption?.value)].map(shortText).filter(Boolean);text=candidates.find(t=>!/^(?:en|English|und)$/i.test(t))||'';const cats=clean(meta.Categories?.value).split(/[,;|]/).map(x=>x.trim()).filter(Boolean).slice(0,3);if(!text)text=cats.length?tr('missing')+' '+cats.join(', '):tr('missing')+' '+tr('fallback')+file;const author=clean(meta.Artist?.value);const license=clean(meta.LicenseShortName?.value);const details=[author?tr('author')+author:'',license?tr('license')+license:''].filter(Boolean).join(' · ');if(details)text+=' — '+details;link.dataset.tooltipBaseText=text;text=await translateText(text,lang);cache.set(cacheKey,text);renderTip(tip,text);link.dataset.loaded='1';}catch(e){console.warn('Tooltip metadata fetch failed',file,e);renderTip(tip,tr('missing')+' '+tr('fallback')+file);}finally{delete link.dataset.loading;if(language()!==lang)loadTooltip(link);}}
  const grid=document.querySelector('.grid');
  const dialog=document.getElementById('descriptionDialog');const dialogBody=document.getElementById('descriptionDialogBody');const dialogTitle=document.getElementById('descriptionDialogTitle');const dialogClose=document.getElementById('descriptionDialogClose');
  grid?.addEventListener('click',e=>{const more=e.target.closest('.show-full-description');if(!more)return;e.preventDefault();e.stopPropagation();const tip=more.closest('.source-tooltip');const copy=tip?.querySelector('.tooltip-copy');dialogBody.textContent=copy?.textContent||'';dialogTitle.textContent=tr('dialogTitle');dialogClose.textContent=tr('close');if(typeof dialog.showModal==='function')dialog.showModal();else alert(dialogBody.textContent);});
  dialogClose?.addEventListener('click',()=>dialog?.close());dialog?.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
  grid?.addEventListener('pointerover',e=>{const link=e.target.closest('.photo-link');if(link&&!link.contains(e.relatedTarget))loadTooltip(link);});grid?.addEventListener('focusin',e=>{const link=e.target.closest('.photo-link');if(link)loadTooltip(link);});
  document.getElementById('languageSelect')?.addEventListener('change',()=>{grid?.querySelectorAll('.photo-link[data-loaded="1"]').forEach(link=>loadTooltip(link));});
})();
</script>
